<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasaporte ALRI</title>
<style>
  :root{
    --blue-deep:#0F4A5E;
    --blue:#1B6D8C;
    --blue-soft:#3D93AC;
    --green:#5CAE6B;
    --green-deep:#3D7A49;
    --paper:#F6F2E7;
    --paper-line:#E3DAC4;
    --ink:#1E2A2E;
    --ink-soft:#5B6B6E;
    --stamp-red:#B4483F;
    --gold:#C6A15B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--blue-deep);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(92,174,107,0.15), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(198,161,91,0.12), transparent 45%);
    font-family:'Courier New', ui-monospace, monospace;
    color:var(--ink);
    min-height:100vh;
    padding:24px 16px;
  }
  .display{font-family:'Georgia', 'Times New Roman', serif; letter-spacing:0.5px;}
  .wrap{max-width:520px;margin:0 auto;}

  /* ---- passport shell ---- */
  .book{
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 25px 60px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
    overflow:hidden;
    position:relative;
  }
  .cover{
    background:linear-gradient(160deg, var(--blue) 0%, var(--blue-deep) 100%);
    color:var(--paper);
    padding:36px 28px 30px;
    text-align:center;
    position:relative;
  }
  .cover::after{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(246,242,231,0.35);
    border-radius:3px;
    pointer-events:none;
  }
  .crest{
    width:72px;height:72px;margin:0 auto 14px;
    border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px rgba(246,242,231,0.5), 0 4px 10px rgba(0,0,0,0.3);
    overflow:hidden;
  }
  .crest img{width:76%;height:76%;object-fit:contain;}
  .cover h1{
    font-size:26px;margin:0 0 4px;letter-spacing:2px;text-transform:uppercase;
  }
  .cover p{
    margin:0;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:rgba(246,242,231,0.75);
  }

  .page{padding:26px 24px 30px;}
  label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin:14px 0 5px;}
  input, select{
    width:100%;padding:10px 12px;border:1px solid var(--paper-line);
    background:#fff;border-radius:3px;font-family:inherit;font-size:14px;color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green);outline-offset:1px;}
  button{
    font-family:'Georgia', serif;
    cursor:pointer;border:none;border-radius:3px;
    padding:13px 18px;font-size:14px;letter-spacing:1px;
    background:var(--blue);color:#fff;width:100%;margin-top:18px;
    transition:transform .15s ease, background .15s ease;
  }
  button:hover{background:var(--blue-deep);transform:translateY(-1px);}
  button.secondary{background:transparent;color:var(--blue);border:1px solid var(--blue);}
  button.secondary:hover{background:rgba(27,109,140,0.08);}
  button.green{background:var(--green-deep);}
  button.green:hover{background:#2f5f38;}
  .error{color:var(--stamp-red);font-size:12px;margin-top:8px;}
  .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .divider{height:1px;background:var(--paper-line);margin:22px 0;}
  .link-btn{background:none;border:none;color:var(--ink-soft);font-size:11px;text-decoration:underline;cursor:pointer;padding:6px 0;width:auto;margin-top:6px;}

  /* ---- passport data page ---- */
  .id-row{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
  .photo-box{
    width:64px;height:76px;flex-shrink:0;
    background:repeating-linear-gradient(45deg, #e9e2cf, #e9e2cf 4px, #ddd3b8 4px, #ddd3b8 8px);
    border:1px solid var(--paper-line);border-radius:2px;
    display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink-soft);
  }
  .id-name{font-family:Georgia, serif;font-size:18px;font-weight:bold;line-height:1.2;}
  .id-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .stat-strip{
    display:flex;justify-content:space-between;background:var(--blue-deep);color:var(--paper);
    padding:12px 16px;border-radius:3px;margin:16px 0 20px;font-size:12px;letter-spacing:0.5px;
  }
  .stat-strip b{font-family:Georgia,serif;font-size:20px;display:block;color:var(--green);}

  /* ---- stamp grid ---- */
  .grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;margin-top:6px;}
  .stamp-slot{
    aspect-ratio:1;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:6px;position:relative;
  }
  .stamp-slot.locked{
    border:2px dashed var(--paper-line);color:var(--paper-line);
  }
  .stamp-slot.locked .lock-icon{font-size:18px;color:#c9bfa2;}
  .stamp-slot.earned{
    border:3px solid var(--stamp-color, var(--stamp-red));
    color:var(--stamp-color, var(--stamp-red));
    mix-blend-mode:multiply;
    transform:rotate(var(--tilt, -6deg));
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.05);
  }
  .stamp-slot.earned .stamp-emoji{font-size:22px;margin-bottom:2px;}
  .stamp-slot.earned .stamp-name{font-size:9px;letter-spacing:0.5px;text-transform:uppercase;font-weight:bold;line-height:1.15;}
  .stamp-slot.earned .stamp-date{font-size:7.5px;margin-top:2px;opacity:0.8;}

  .empty-note{text-align:center;color:var(--ink-soft);font-size:12px;padding:20px 10px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--green-deep);color:#fff;padding:12px 20px;border-radius:30px;
    font-family:Georgia,serif;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,0.3);
    z-index:50; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .admin-link{
    display:block;text-align:center;margin-top:16px;font-size:11px;color:rgba(246,242,231,0.6);
    text-decoration:none;background:none;border:none;cursor:pointer;width:100%;
  }

  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px;}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--paper-line);}
  th{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);}
  .badge-count{background:var(--green-deep);color:#fff;border-radius:10px;padding:2px 8px;font-size:10px;}
  .event-row{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--paper-line);}
  .event-row input{flex:1;}
  .event-row select{width:70px;flex:none;}
  .del-btn{background:var(--stamp-red);color:#fff;width:auto;padding:8px 10px;margin:0;font-size:11px;flex:none;}
  .tab-row{display:flex;gap:8px;margin-bottom:16px;}
  .tab-row button{margin-top:0;padding:9px;font-size:12px;}
  .tab-row button.inactive{background:transparent;color:var(--blue);border:1px solid var(--paper-line);}
  .loading{text-align:center;padding:40px 0;color:var(--ink-soft);font-size:12px;}
  .csv-btn{background:var(--gold);color:var(--ink);}
</style>
</head>

const PENDING_STAMP_KEY = 'alri_pending_stamp';
function stashPendingStamp(matricula, eventId, comment){
  try{ sessionStorage.setItem(PENDING_STAMP_KEY, JSON.stringify({matricula, eventId, comment})); }catch(e){}
}
function clearPendingStamp(){
  try{ sessionStorage.removeItem(PENDING_STAMP_KEY); }catch(e){}
}
function readPendingStamp(){
  try{ const raw = sessionStorage.getItem(PENDING_STAMP_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}

function render(){
  const root = document.getElementById('root');
  root.innerHTML = '';
  if(state.loading){ root.appendChild(LoadingView()); return; }
  if(state.view==='home') root.appendChild(HomeView());
  else if(state.view==='register') root.appendChild(RegisterView());
  else if(state.view==='passport') root.appendChild(PassportView());
  else if(state.view==='addEvent') root.appendChild(AddEventChoice());
  else if(state.view==='adminLogin') root.appendChild(AdminLogin());
  else if(state.view==='admin') root.appendChild(AdminView());
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==='class') e.className = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else if(k==='html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(typeof c==='string') e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}

// ---- Backend calls ----
async function apiGet(){
  const res = await fetch(API_URL, { method:'GET' });
  if(!res.ok) throw new Error('http_'+res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error||'unknown');
  return json.data;
}

async function apiPost(body){
  const res = await fetch(API_URL, {
    method:'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight against Apps Script
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error('http_'+res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error||'unknown');
  return json.data;
}

async function loadData(){
  state.loading = true; render();
  try{
    DATA = await apiGet();
  }catch(err){
    showToast('No se pudo conectar con la base de datos. Revisa tu conexión e intenta de nuevo.');
  }
  state.loading = false;
  checkPendingStamp();
  render();
}

function LoadingView(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Cargando…'));
  const page = el('div',{class:'page'});
  page.appendChild(el('p',{class:'loading'},['Conectando con el pasaporte…']));
  book.appendChild(page);
  return book;
}

function Cover(subtitle){
  const cover = el('div',{class:'cover'});
  cover.appendChild(el('div',{class:'crest'},[el('img',{src:LOGO_SRC, alt:'Logo ALRI'})]));
  cover.appendChild(el('h1',{class:'display'},['Pasaporte ALRI']));
  cover.appendChild(el('p',{},[subtitle || 'Conectando Fronteras']));
  return cover;
}

function HomeView(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Asociación de Relaciones Internacionales'));
  const page = el('div',{class:'page'});
  page.appendChild(el('label',{},['Matrícula']));
  const input = el('input',{placeholder:'A01234567', value:state.matricula});
  input.addEventListener('input', e=>state.matricula = e.target.value.trim());
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') onEnter(); });
  page.appendChild(input);
  page.appendChild(el('p',{class:'hint'},['Escribe tu matrícula para ver tu pasaporte o registrarte por primera vez.']));
  if(state.error) page.appendChild(el('p',{class:'error'},[state.error]));
  page.appendChild(el('button',{onClick: onEnter},['Entrar →']));
  page.appendChild(el('div',{class:'divider'}));
  page.appendChild(el('button',{class:'link-btn', onClick: ()=>{state.view='adminLogin'; render();}},['Acceso Mesa Directiva']));
  book.appendChild(page);
  return book;
}

function onEnter(){
  if(!state.matricula){ state.error='Escribe tu matrícula.'; render(); return; }
  state.error='';
  const existing = DATA.users[state.matricula];
  if(existing){
    state.user = existing;
    state.view='passport';
  } else {
    state.user = null;
    state.view='register';
  }
  render();
}

function RegisterView(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Nuevo registro'));
  const page = el('div',{class:'page'});
  page.appendChild(el('p',{class:'hint'},['No encontramos tu matrícula. Regístrate una sola vez — tus datos se guardarán para futuros eventos.']));

  const fields = {};
  function field(labelText, key, type, options){
    page.appendChild(el('label',{},[labelText]));
    let input;
    if(type==='select'){
      input = el('select',{});
      options.forEach(o=>input.appendChild(el('option',{value:o},[o])));
    } else {
      input = el('input',{type: type||'text'});
    }
    input.addEventListener('input', e=>fields[key]=e.target.value);
    input.addEventListener('change', e=>fields[key]=e.target.value);
    page.appendChild(input);
    return input;
  }
  field('Nombre completo','nombre');
  field('Correo institucional','correo','email');
  field('Carrera (Siglas) — ej. LRI, LED, LEC','carrera');
  field('Semestre','semestre','select',['1','2','3','4','5','6','7','8','9+']);
  field('Edad','edad','number');
  field('Sexo','sexo','select',['Mujer','Hombre','Prefiero no decirlo']);

  const err = el('p',{class:'error'});
  page.appendChild(err);

  const submitBtn = el('button',{onClick: async ()=>{
    if(!fields.nombre || !fields.correo || !fields.carrera){
      err.textContent = 'Completa al menos nombre, correo y carrera.'; return;
    }
    // Snapshot the matrícula this specific submission is for, RIGHT NOW.
    // state.matricula is a shared global — if the student (or, during
    // testing, whoever's at the keyboard) navigates back and starts a
    // second registration before this fetch() resolves (Apps Script can
    // take several seconds per call), state.matricula changes out from
    // under us. Reading state.matricula again after the await would then
    // apply THIS response to the WRONG student. Everything below uses
    // submittedMatricula instead of the live state.matricula.
    const submittedMatricula = state.matricula;
    submitBtn.textContent = 'Guardando…'; submitBtn.disabled = true;
    const newUser = {
      matricula: submittedMatricula,
      nombre: fields.nombre, correo: fields.correo||'', carrera: fields.carrera||'',
      semestre: fields.semestre||'1', edad: fields.edad||'', sexo: fields.sexo||'Prefiero no decirlo',
      badges: []
    };
    try{
      const freshData = await apiPost({ action:'register', user:newUser });
      DATA = freshData;
      if(state.matricula === submittedMatricula && state.view === 'register'){
        // Still the same student, still on this screen — safe to advance.
        state.user = DATA.users[submittedMatricula];
        state.view='passport';
        showToast('¡Registro completo! Bienvenid@ a ALRI.');
        render();
      }
      // Otherwise: the person has already navigated elsewhere (e.g. typed a
      // new matrícula and moved on). The registration still saved correctly
      // server-side — we just don't yank them back to a passport view they
      // didn't ask for. Re-entering their matrícula will show it correctly.
    }catch(err2){
      if(state.matricula === submittedMatricula && state.view === 'register'){
        err.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
        submitBtn.textContent = 'Crear mi pasaporte'; submitBtn.disabled = false;
      }
    }
  }},['Crear mi pasaporte']);
  page.appendChild(submitBtn);

  page.appendChild(el('button',{class:'link-btn', onClick:()=>{state.view='home'; render();}},['← Volver']));
  book.appendChild(page);
  return book;
}

function colorForEvent(id){
  let hash=0; for(let i=0;i<id.length;i++) hash = id.charCodeAt(i) + ((hash<<5)-hash);
  return STAMP_COLORS[Math.abs(hash) % STAMP_COLORS.length];
}
function emojiForEvent(id){
  let hash=0; for(let i=0;i<id.length;i++) hash = id.charCodeAt(i)*3 + ((hash<<5)-hash);
  return EMOJIS[Math.abs(hash) % EMOJIS.length];
}
function tiltForEvent(id){
  let hash=0; for(let i=0;i<id.length;i++) hash += id.charCodeAt(i);
  return (hash % 14 - 7) + 'deg';
}

function PassportView(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Pasaporte personal'));
  const page = el('div',{class:'page'});

  const idRow = el('div',{class:'id-row'});
  idRow.appendChild(el('div',{class:'photo-box'},['🎓']));
  const idInfo = el('div',{});
  idInfo.appendChild(el('div',{class:'id-name'},[state.user.nombre]));
  idInfo.appendChild(el('div',{class:'id-meta'},[state.user.carrera+' · Semestre '+state.user.semestre]));
  idInfo.appendChild(el('div',{class:'id-meta'},['Matrícula: '+state.user.matricula]));
  idRow.appendChild(idInfo);
  page.appendChild(idRow);

  const earnedCount = state.user.badges.length;
  const totalCount = DATA.events.length;
  const strip = el('div',{class:'stat-strip'});
  strip.appendChild(el('div',{},[el('b',{},[String(earnedCount)]), 'Eventos asistidos']));
  strip.appendChild(el('div',{},[el('b',{},[String(totalCount)]), 'Eventos disponibles']));
  page.appendChild(strip);

  const grid = el('div',{class:'grid'});
  if(DATA.events.length===0){
    page.appendChild(el('p',{class:'empty-note'},['Aún no hay eventos cargados. Vuelve pronto — Mesa Directiva está preparando la agenda del semestre.']));
  } else {
    DATA.events.forEach(ev=>{
      const earned = state.user.badges.find(b=>b.eventId===ev.id);
      if(earned){
        const slot = el('div',{class:'stamp-slot earned'});
        slot.style.setProperty('--stamp-color', colorForEvent(ev.id));
        slot.style.setProperty('--tilt', tiltForEvent(ev.id));
        slot.appendChild(el('div',{class:'stamp-emoji'},[emojiForEvent(ev.id)]));
        slot.appendChild(el('div',{class:'stamp-name'},[ev.name]));
        slot.appendChild(el('div',{class:'stamp-date'},[earned.date]));
        grid.appendChild(slot);
      } else {
        const slot = el('div',{class:'stamp-slot locked'});
        slot.appendChild(el('div',{class:'lock-icon'},['○']));
        grid.appendChild(slot);
      }
    });
  }
  page.appendChild(grid);

  page.appendChild(el('div',{class:'divider'}));
  page.appendChild(el('button',{class:'green', onClick:()=>{state.view='addEvent'; render();}},['+ Registrar asistencia a un evento']));
  page.appendChild(el('button',{class:'link-btn', onClick:()=>{state.view='home'; state.matricula=''; state.user=null; render();}},['← Salir']));
  book.appendChild(page);
  return book;
}

function AddEventChoice(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Sellar pasaporte'));
  const page = el('div',{class:'page'});

  if(state.selectedEvent){
    const ev = state.selectedEvent;
    page.appendChild(el('p',{class:'hint'},['Antes de recibir tu sello de "'+ev.name+'", cuéntanos qué te pareció el evento. Tu opinión nos ayuda a mejorar los siguientes.']));
    if(state.resumeNotice){
      page.appendChild(el('p',{class:'hint'},['⚠ Tu envío anterior no se completó. Recuperamos tu comentario — solo vuelve a enviarlo.']));
    }
    page.appendChild(el('label',{},['Comentario sobre el evento']));
    const textarea = document.createElement('textarea');
    textarea.rows = 4;
    textarea.style.cssText = "width:100%;padding:10px 12px;border:1px solid var(--paper-line);background:#fff;border-radius:3px;font-family:inherit;font-size:14px;color:var(--ink);resize:vertical;";
    textarea.placeholder = "Ej. Me gustó la dinámica, faltó tiempo para preguntas...";
    if(state.resumeNotice) textarea.value = state.resumeNotice.comment || '';
    page.appendChild(textarea);
    const err = el('p',{class:'error'});
    page.appendChild(err);

    const submitBtn = el('button',{class:'green', onClick: async ()=>{
      const comment = textarea.value.trim();
      if(!comment){ err.textContent = 'El comentario es obligatorio para recibir tu insignia.'; return; }
      // Snapshot everything this submission is for, right now — same
      // reasoning as the registration handler: state.user can change out
      // from under an in-flight request if someone navigates away before
      // Apps Script responds (it can take a few seconds per call).
      const submittedMatricula = state.user.matricula;
      const submittedNombre = state.user.nombre;
      submitBtn.textContent = 'Guardando…'; submitBtn.disabled = true;

      // Stash before sending: if the request fails (network drop, Apps
      // Script cold-start timeout, etc.) we can resume right here with the
      // comment intact instead of losing it.
      stashPendingStamp(submittedMatricula, ev.id, comment);

      try{
        const freshData = await apiPost({
          action:'stamp',
          matricula: submittedMatricula,
          eventId: ev.id,
          comment: comment,
          nombre: submittedNombre,
          eventName: ev.name,
          date: new Date().toLocaleDateString('es-MX')
        });
        DATA = freshData;
        clearPendingStamp();
        if(state.user && state.user.matricula === submittedMatricula && state.view === 'addEvent'){
          state.user = DATA.users[submittedMatricula];
          state.selectedEvent = null;
          state.resumeNotice = null;
          state.view='passport';
          showToast('¡Sello de '+ev.name+' agregado! Gracias por tu comentario.');
          render();
        }
        // Otherwise the person already navigated elsewhere; the stamp still
        // saved correctly server-side, we just don't redirect them.
      }catch(err2){
        // Leave the stash in place — the student can reload or retry and
        // we'll resume them right back on this step with the comment.
        if(state.user && state.user.matricula === submittedMatricula && state.view === 'addEvent'){
          err.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
          submitBtn.textContent = 'Enviar comentario y recibir mi sello'; submitBtn.disabled = false;
        }
      }
    }},['Enviar comentario y recibir mi sello']);
    page.appendChild(submitBtn);
    page.appendChild(el('button',{class:'link-btn', onClick:()=>{state.selectedEvent=null; clearPendingStamp(); render();}},['← Elegir otro evento']));
  } else {
    const pending = DATA.events.filter(ev => !state.user.badges.find(b=>b.eventId===ev.id));
    if(pending.length===0){
      page.appendChild(el('p',{class:'empty-note'},['¡Ya tienes el sello de todos los eventos disponibles! 🎉']));
    } else {
      page.appendChild(el('p',{class:'hint'},['Selecciona el evento al que acabas de asistir:']));
      pending.forEach(ev=>{
        const b = el('button',{class:'secondary'},[emojiForEvent(ev.id)+'  '+ev.name+(ev.date?' · '+ev.date:'')]);
        b.addEventListener('click', ()=>{
          state.selectedEvent = ev;
          render();
        });
        page.appendChild(b);
      });
    }
    page.appendChild(el('button',{class:'link-btn', onClick:()=>{state.view='passport'; render();}},['← Volver a mi pasaporte']));
  }
  book.appendChild(page);
  return book;
}

function AdminLogin(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Acceso restringido'));
  const page = el('div',{class:'page'});
  page.appendChild(el('label',{},['Contraseña de Mesa Directiva']));
  const pass = el('input',{type:'password'});
  page.appendChild(pass);
  const err = el('p',{class:'error'});
  page.appendChild(err);
  const tryLogin = ()=>{
    if(pass.value === ADMIN_PASSWORD){
      state.adminAuth = true;
      state.adminTab = 'eventos';
      state.view='admin';
      render();
    } else {
      err.textContent = 'Contraseña incorrecta.';
    }
  };
  pass.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  page.appendChild(el('button',{onClick: tryLogin},['Entrar']));
  page.appendChild(el('p',{class:'hint'},['Solicita la contraseña a Mesa Directiva.']));
  page.appendChild(el('button',{class:'link-btn', onClick:()=>{state.view='home'; render();}},['← Volver']));
  book.appendChild(page);
  return book;
}

function AdminView(){
  const book = el('div',{class:'book'});
  book.appendChild(Cover('Panel Mesa Directiva'));
  const page = el('div',{class:'page'});

  const tabs = el('div',{class:'tab-row'});
  const btnEv = el('button',{class: state.adminTab==='eventos'?'':'inactive'},['Eventos']);
  const btnDb = el('button',{class: state.adminTab==='db'?'':'inactive'},['Base de datos']);
  const btnCm = el('button',{class: state.adminTab==='comentarios'?'':'inactive'},['Comentarios']);
  btnEv.addEventListener('click', ()=>{state.adminTab='eventos'; render();});
  btnDb.addEventListener('click', ()=>{state.adminTab='db'; render();});
  btnCm.addEventListener('click', ()=>{state.adminTab='comentarios'; render();});
  tabs.appendChild(btnEv); tabs.appendChild(btnDb); tabs.appendChild(btnCm);
  page.appendChild(tabs);

  const content = el('div',{id:'admin-content'});
  page.appendChild(content);

  if(state.adminTab==='eventos'){
    // Work on a local editable copy; only sent to the backend on "Guardar cambios".
    if(!state._editEvents) state._editEvents = DATA.events.map(e=>({...e}));
    state._editEvents.forEach((ev, idx)=>{
      const row = el('div',{class:'event-row'});
      const nameInput = el('input',{value:ev.name});
      nameInput.addEventListener('input', e=>ev.name=e.target.value);
      const dateInput = el('input',{type:'date', value:ev.date||''});
      dateInput.addEventListener('input', e=>ev.date=e.target.value);
      const del = el('button',{class:'del-btn'},['Eliminar']);
      del.addEventListener('click', ()=>{
        state._editEvents.splice(idx,1);
        render();
      });
      row.appendChild(nameInput); row.appendChild(dateInput); row.appendChild(del);
      content.appendChild(row);
    });
    const addBtn = el('button',{class:'secondary'},['+ Agregar evento nuevo']);
    addBtn.addEventListener('click', ()=>{
      state._editEvents.push({id:'ev_'+Date.now(), name:'Nuevo evento', date:''});
      render();
    });
    content.appendChild(addBtn);
    const saveBtn = el('button',{class:'green'},['Guardar cambios']);
    saveBtn.addEventListener('click', async ()=>{
      saveBtn.textContent = 'Guardando…'; saveBtn.disabled = true;
      try{
        DATA = await apiPost({ action:'adminSaveEvents', password: ADMIN_PASSWORD, events: state._editEvents });
        state._editEvents = null;
        showToast('Eventos actualizados.');
        render();
      }catch(err){
        showToast('No se pudo guardar. Intenta de nuevo.');
        saveBtn.textContent = 'Guardar cambios'; saveBtn.disabled = false;
      }
    });
    content.appendChild(saveBtn);
  } else if(state.adminTab==='db'){
    renderAdminDb(content);
  } else {
    renderAdminComments(content);
  }

  page.appendChild(el('button',{class:'link-btn', onClick:()=>{state.view='home'; state.adminAuth=false; state._editEvents=null; render();}},['← Cerrar sesión']));
  book.appendChild(page);
  return book;
}

function renderAdminDb(content){
  const users = Object.values(DATA.users).sort((a,b)=> (b.badges?.length||0) - (a.badges?.length||0));
  if(users.length===0){
    content.appendChild(el('p',{class:'empty-note'},['Aún no hay registros de estudiantes.']));
    return;
  }
  const csvBtn = el('button',{class:'csv-btn'},['⬇ Exportar CSV']);
  const csvPanel = el('div',{class:'csv-panel', style:'display:none;margin-top:10px;'});
  csvBtn.addEventListener('click', ()=>{
    if(csvPanel.style.display === 'none'){
      renderCsvPanel(csvPanel, users);
      csvPanel.style.display = 'block';
      csvBtn.textContent = '▲ Ocultar CSV';
    } else {
      csvPanel.style.display = 'none';
      csvPanel.innerHTML = '';
      csvBtn.textContent = '⬇ Exportar CSV';
    }
  });
  content.appendChild(csvBtn);
  content.appendChild(csvPanel);

  const table = el('table',{});
  const thead = el('tr',{});
  ['Nombre','Matrícula','Carrera','Sem.','Edad','Sexo','Correo','Sellos'].forEach(h=>thead.appendChild(el('th',{},[h])));
  table.appendChild(thead);
  users.forEach(u=>{
    const tr = el('tr',{});
    [u.nombre,u.matricula,u.carrera,u.semestre,u.edad,u.sexo,u.correo].forEach(v=>tr.appendChild(el('td',{},[String(v||'')])));
    tr.appendChild(el('td',{},[el('span',{class:'badge-count'},[String(u.badges?.length||0)])]));
    table.appendChild(tr);
  });
  content.appendChild(table);
}

function renderAdminComments(content){
  const comments = DATA.comments.slice().reverse();
  if(comments.length===0){
    content.appendChild(el('p',{class:'empty-note'},['Aún no hay comentarios registrados.']));
    return;
  }
  const table = el('table',{});
  const thead = el('tr',{});
  ['Evento','Estudiante','Comentario','Fecha'].forEach(h=>thead.appendChild(el('th',{},[h])));
  table.appendChild(thead);
  comments.forEach(c=>{
    const tr = el('tr',{});
    tr.appendChild(el('td',{},[c.eventName||'']));
    tr.appendChild(el('td',{},[c.nombre||c.matricula||'']));
    tr.appendChild(el('td',{},[c.comment||'']));
    tr.appendChild(el('td',{},[c.date||'']));
    table.appendChild(tr);
  });
  content.appendChild(table);
}

function csvText(users){
  const headers = ['Nombre','Matricula','Carrera','Semestre','Edad','Sexo','Correo','NumEventos','Eventos'];
  const rows = users.map(u=>[
    u.nombre,u.matricula,u.carrera,u.semestre,u.edad,u.sexo,u.correo,
    (u.badges||[]).length,
    (u.badges||[]).map(b=>b.eventId).join('|')
  ]);
  return [headers, ...rows].map(r=>r.map(f=>'"'+String(f||'').replace(/"/g,'""')+'"').join(',')).join('\n');
}

function renderCsvPanel(panel, users){
  const csv = csvText(users);
  panel.appendChild(el('p',{class:'hint'},['Selecciona todo el texto y cópialo (Ctrl/Cmd+A, luego Ctrl/Cmd+C) para pegarlo en Excel o Google Sheets. También puedes abrir la hoja de cálculo original directamente.']));
  const textarea = document.createElement('textarea');
  textarea.readOnly = true;
  textarea.rows = 8;
  textarea.value = csv;
  textarea.style.cssText = "width:100%;padding:10px 12px;border:1px solid var(--paper-line);background:#fff;border-radius:3px;font-family:'Courier New',monospace;font-size:11px;color:var(--ink);resize:vertical;";
  panel.appendChild(textarea);

  const selectBtn = el('button',{class:'secondary'},['Seleccionar todo']);
  selectBtn.addEventListener('click', ()=>{ textarea.focus(); textarea.select(); });
  panel.appendChild(selectBtn);

  if(navigator.clipboard && navigator.clipboard.writeText){
    const copyBtn = el('button',{class:'secondary'},['Copiar al portapapeles']);
    copyBtn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(csv);
        showToast('CSV copiado al portapapeles.');
      }catch(err){
        textarea.focus(); textarea.select();
        showToast('No se pudo copiar automáticamente — el texto ya está seleccionado, usa Ctrl/Cmd+C.');
      }
    });
    panel.appendChild(copyBtn);
  }
}

// ---- On load, check whether we're resuming after a failed stamp submit. ----
function checkPendingStamp(){
  const pending = readPendingStamp();
  if(!pending) return;
  const user = DATA.users[pending.matricula];
  const event = DATA.events.find(e=>e.id===pending.eventId);
  if(!user || !event){ clearPendingStamp(); return; }
  const alreadyStamped = user.badges.find(b=>b.eventId===pending.eventId);
  if(alreadyStamped){
    clearPendingStamp();
    return;
  }
  state.matricula = pending.matricula;
  state.user = user;
  state.selectedEvent = event;
  state.resumeNotice = { comment: pending.comment };
  state.view = 'addEvent';
}

loadData();
